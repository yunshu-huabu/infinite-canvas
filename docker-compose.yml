services:
  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    volumes:
      - infinite-canvas-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID
    #   ADMIN_USERNAME: admin                              # 初始管理员用户名
    #   ADMIN_PASSWORD: change-this-password              # 首次启动密码；未设置时会打印随机密码
    #   CONFIG_ENCRYPTION_KEY: replace-with-a-long-secret  # 配置加密密钥；生产环境建议显式设置

volumes:
  infinite-canvas-data:
